name: Prepare dependency lockfile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - pnpm-workspace.yaml
      - .github/workflows/prepare-lockfile.yml

permissions:
  contents: read

jobs:
  prepare-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: node:24.22.2-bookworm@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
      options: --memory=4g --memory-swap=4g --cpus=2 --pids-limit=128
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      # The required CI job still installs the checked-in lockfile frozen.
      # This read-only helper produces a reviewable artifact, never a commit.
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Bind the generated lockfile to this source
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > lockfile-source.txt
          sha256sum pnpm-lock.yaml >> lockfile-source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-lockfile-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            lockfile-source.txt
          retention-days: 2
          if-no-files-found: error
