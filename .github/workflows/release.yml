name: Release packages

on:
  push:
    branches: [main]

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    name: Version pull request or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Open the version pull request, or publish unreleased versions
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          changeset=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)
          if [[ -n "$changeset" ]]; then
            pnpm release:version
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -B changeset-release/main
            git add --all
            git commit -m 'chore: version packages'
            git push --force origin HEAD:refs/heads/changeset-release/main
            pr=$(gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty')
            if [[ -z "$pr" ]]; then
              create_error=$(mktemp)
              trap 'rm -f "$create_error"' EXIT
              manual_pr=false
              if gh pr create --base main --head changeset-release/main \
                --title 'chore: version packages' \
                --body 'Automated Changesets version pull request.' 2>"$create_error"; then
                :
              elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$create_error"; then
                manual_pr=true
              else
                cat "$create_error" >&2
                exit 1
              fi
              pr=$(gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty')
              if [[ -z "$pr" && "$manual_pr" != true ]]; then
                echo 'Version pull request creation did not produce an open pull request.' >&2
                exit 1
              fi
              if [[ -z "$pr" ]]; then
                echo '::warning::The generated version branch needs a maintainer-created pull request; Actions PR creation is disabled.'
                {
                  echo '### Generated version branch awaits a maintainer'
                  echo "Exact commit: $(git rev-parse HEAD)"
                  echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/main...changeset-release/main"
                  echo 'No package was published by this handoff.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit 0
          fi
          for manifest in packages/*/package.json; do
            name=$(jq -r '.name' "$manifest")
            version=$(jq -r '.version' "$manifest")
            if [[ "$(jq -r '.private // false' "$manifest")" == "true" || "$version" == "0.0.0" ]]; then
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              continue
            fi
            pnpm --filter "$name" publish --access public --no-git-checks
          done
